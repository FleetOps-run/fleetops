# Installs FleetOps with helmfile (https://helmfile.readthedocs.io).
#
# Copy this file and values.yaml into your own repository, edit values.yaml,
# then run:
#
#   helmfile apply
#
# values.yaml holds only the settings most installs change. Every option and
# its default is in the chart's values.yaml:
#   https://github.com/FleetOps-run/fleetops/blob/main/deploy/helm/fleetops/values.yaml
# or run `helm show values oci://ghcr.io/fleetops-run/charts/fleetops --version <version>`.

# The chart comes from the OCI registry. To use the classic repository
# instead, add
#   repositories:
#     - name: fleetops
#       url: https://fleetops-run.github.io/fleetops
# and set `chart: fleetops/fleetops`.

releases:
  - name: fleetops
    namespace: fleetops
    createNamespace: true
    chart: oci://ghcr.io/fleetops-run/charts/fleetops
    # Pin the chart so `helmfile apply` never upgrades by surprise; bump it to
    # upgrade FleetOps.
    version: 1.5.0
    values:
      - values.yaml
